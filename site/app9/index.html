<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原稿用紙作成</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="../themes/theme.js"></script>
<link rel="stylesheet" href="../themes/pop.css">
<link rel="stylesheet" href="../themes/forest.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../shared/transport.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  background: #ecefee;
  color: #2b2b2b;
}
.controls { max-width: 780px; margin: 18px auto 0; padding: 0 14px; }
.panel {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  padding: 16px 20px;
}
.panel h1 { font-size: 18px; margin: 0 0 14px; color: #20574a; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 12px; }
fieldset.dirs {
  border: 1px solid #ddd; border-radius: 8px; padding: 8px 16px 10px; margin: 0;
  display: flex; gap: 18px;
}
legend { font-size: 13px; color: #666; padding: 0 6px; }
.radio label { cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.field { display: flex; align-items: center; gap: 8px; font-size: 15px; }
input[type=number] {
  width: 76px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px;
  font-size: 15px; text-align: center;
}
.count { font-size: 14px; color: #20574a; font-weight: 600; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button {
  background: #f2f5f3; border: 1px solid #c8d2cc; border-radius: 6px;
  padding: 6px 12px; font-size: 14px; cursor: pointer;
}
.presets button:hover { background: #e2eae6; }
.swatches { display: flex; align-items: center; gap: 10px; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0;
}
.swatch.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #2e7d63; }
input[type=color] {
  width: 36px; height: 30px; padding: 2px;
  border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer;
}
.custom-label { font-size: 13px; color: #666; }
.chk { font-size: 15px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.actions button {
  font-size: 16px; padding: 10px 26px; border-radius: 8px; border: none;
  cursor: pointer; color: #fff;
}
#printBtn { background: #2e7d63; }
#printBtn:hover { background: #276a54; }
#classroomBtn { background: #b0713a; }
#classroomBtn:hover:not([disabled]) { background: #96602f; }
#classroomBtn[disabled] { opacity: .6; cursor: default; }
.sendStatus { font-size: 13px; color: #555; }
.hint { font-size: 12.5px; color: #777; margin: 10px 0 0; }

.page-wrap { overflow: auto; padding: 18px 0 48px; }
.sheet {
  width: 210mm; min-height: 297mm; background: #fff;
  margin: 0 auto; padding: 10mm;
  box-shadow: 0 3px 18px rgba(0,0,0,.16);
}

.doc-header { margin: 0 0 5mm; }
.dh-row { display: flex; align-items: flex-end; gap: 2.5mm; }
.dh-row.name { justify-content: flex-end; margin-top: 3.5mm; }
.dh-label {
  border: 0.35mm solid #444; color: #222; font-size: 11pt; line-height: 1;
  padding: 1.4mm 1.4mm 1.4mm 2.8mm; letter-spacing: .28em;
}
.dh-line { flex: 1 1 auto; border-bottom: 0.35mm solid #444; height: 6.5mm; }
.dh-row.name .dh-line { flex: 0 0 58mm; }

table.grid { border-collapse: collapse; table-layout: fixed; margin: 0 auto; }
table.grid td { border: 0.25mm solid var(--line-color, #bcd0c6); padding: 0; }

@media print {
  @page { size: A4 portrait; margin: 10mm; }
  body { background: #fff; }
  .no-print { display: none !important; }
  .page-wrap { overflow: visible; padding: 0; }
  .sheet {
    width: auto; min-height: auto; margin: 0; padding: 0;
    box-shadow: none; zoom: 1 !important;
  }
}
</style>
</head>
<body>

<div class="controls no-print">
  <div class="panel">
    <h1>原稿用紙作成</h1>

    <div class="row">
      <fieldset class="dirs">
        <legend>書き方向</legend>
        <span class="radio"><label><input type="radio" name="dir" value="tate">縦書き</label></span>
        <span class="radio"><label><input type="radio" name="dir" value="yoko" checked>横書き</label></span>
      </fieldset>
      <span class="field">1行のマス数 <input type="number" id="masu" value="20" min="1" max="50"></span>
      <span class="field">行数 <input type="number" id="gyo" value="20" min="1" max="50"></span>
      <span class="count" id="count"></span>
    </div>

    <div class="row presets">
      <button data-n="20" data-l="20">400字詰め(20×20)</button>
      <button data-n="20" data-l="10">200字詰め(20×10)</button>
      <button data-n="30" data-l="20">600字詰め(30×20)</button>
      <button data-n="10" data-l="10">100字詰め(10×10)</button>
    </div>

    <div class="row">
      <span class="field">罫線の色</span>
      <div class="swatches">
        <button class="swatch" data-color="#bcd0c6" title="緑(定番)" style="background:#bcd0c6"></button>
        <button class="swatch" data-color="#c8c8c8" title="グレー" style="background:#c8c8c8"></button>
        <button class="swatch" data-color="#bccde2" title="青" style="background:#bccde2"></button>
        <button class="swatch" data-color="#ecd0da" title="ピンク" style="background:#ecd0da"></button>
        <button class="swatch" data-color="#e3d6bf" title="ベージュ" style="background:#e3d6bf"></button>
        <input type="color" id="customColor" value="#bcd0c6" title="カスタムカラー">
        <span class="custom-label">カスタム</span>
      </div>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="headerChk" checked>題名・氏名欄を付ける</label>
    </div>

    <div class="actions">
      <button id="printBtn">印刷する</button>
      <button id="classroomBtn" style="display:none">教室タブレットで印刷</button>
      <span class="sendStatus" id="sendStatus"></span>
    </div>
    <p class="hint">印刷ダイアログの保存先で「PDFに保存」を選ぶとPDFファイルも作成できます。どのサイズでも必ずA4用紙1枚に収まります。設定はこのブラウザに自動保存され、次回開いたときに復元されます。<br>※PDF出力には <a href="https://github.com/parallax/jsPDF" target="_blank" rel="noopener">jsPDF</a>・<a href="https://html2canvas.hertzen.com/" target="_blank" rel="noopener">html2canvas</a> (MIT License) を利用しています。</p>
  </div>
</div>

<div class="page-wrap">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  var KEY = 'genkoshi-settings-v2';
  var DEFAULTS = { dir: 'yoko', n: 20, l: 20, header: true, color: '#bcd0c6' };
  var sheet = document.getElementById('sheet');
  var nIn = document.getElementById('masu');
  var lIn = document.getElementById('gyo');
  var countLbl = document.getElementById('count');
  var headerChk = document.getElementById('headerChk');
  var dirRadios = document.querySelectorAll('input[name="dir"]');
  var swatches = document.querySelectorAll('.swatch');
  var customColor = document.getElementById('customColor');
  var MIN = 1, MAX = 50;
  var lastColor = DEFAULTS.color;

  function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
  function readNum(el, dflt) {
    var v = parseInt(el.value, 10);
    return Number.isFinite(v) ? clamp(v) : dflt;
  }
  function getDir() {
    for (var i = 0; i < dirRadios.length; i++) if (dirRadios[i].checked) return dirRadios[i].value;
    return 'tate';
  }

  function currentState() {
    return {
      dir: getDir(),
      n: readNum(nIn, DEFAULTS.n),
      l: readNum(lIn, DEFAULTS.l),
      header: headerChk.checked,
      color: lastColor
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return null;
      var st = {};
      st.dir = s.dir === 'yoko' || s.dir === 'tate' ? s.dir : DEFAULTS.dir;
      st.n = Number.isFinite(parseInt(s.n, 10)) ? clamp(parseInt(s.n, 10)) : DEFAULTS.n;
      st.l = Number.isFinite(parseInt(s.l, 10)) ? clamp(parseInt(s.l, 10)) : DEFAULTS.l;
      st.header = typeof s.header === 'boolean' ? s.header : DEFAULTS.header;
      st.color = /^#[0-9a-fA-F]{6}$/.test(String(s.color)) ? String(s.color).toLowerCase() : DEFAULTS.color;
      return st;
    } catch (e) { return null; }
  }

  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(currentState())); } catch (e) {}
  }

  function setColor(c, persist) {
    lastColor = String(c).toLowerCase();
    sheet.style.setProperty('--line-color', lastColor);
    customColor.value = lastColor;
    Array.prototype.forEach.call(swatches, function (b) {
      b.classList.toggle('active', b.getAttribute('data-color').toLowerCase() === lastColor);
    });
    if (persist) saveState();
  }

  function applyState(st) {
    document.querySelector('input[name="dir"][value="' + st.dir + '"]').checked = true;
    nIn.value = st.n;
    lIn.value = st.l;
    headerChk.checked = st.header;
    setColor(st.color, false);
  }

  function render() {
    var dir = getDir();
    var n = readNum(nIn, DEFAULTS.n);
    var l = readNum(lIn, DEFAULTS.l);
    countLbl.textContent = (n * l) + '字';

    var headerOn = headerChk.checked;
    var HEADER_MM = 24;
    var availW = 190, availH = 277 - (headerOn ? HEADER_MM : 0);
    var cols = dir === 'yoko' ? n : l;
    var rows = dir === 'yoko' ? l : n;
    var cell = Math.min(availW / cols, availH / rows);
    cell = Math.floor(cell * 100) / 100;

    var h = '';
    if (headerOn) {
      h += '<div class="doc-header">'
        + '<div class="dh-row"><span class="dh-label">題名</span><span class="dh-line"></span></div>'
        + '<div class="dh-row name"><span class="dh-label">氏名</span><span class="dh-line"></span></div>'
        + '</div>';
    }
    var cs = 'width:' + cell + 'mm;height:' + cell + 'mm;';
    var tds = '';
    for (var r = 0; r < rows; r++) {
      tds += '<tr>';
      if (dir === 'yoko') {
        for (var c = 0; c < cols; c++) tds += '<td style="' + cs + '"></td>';
      } else {
        for (var c2 = cols - 1; c2 >= 0; c2--) tds += '<td style="' + cs + '"></td>';
      }
      tds += '</tr>';
    }
    h += '<table class="grid" style="width:' + (cell * cols) + 'mm">' + tds + '</table>';
    sheet.innerHTML = h;
    fitZoom();
  }

  function fitZoom() {
    var BASE = 210 * 96 / 25.4;
    var avail = document.documentElement.clientWidth - 16;
    var z = Math.min(1, avail / BASE);
    sheet.style.zoom = z < 1 ? z : 1;
  }

  nIn.addEventListener('input', function () { render(); saveState(); });
  lIn.addEventListener('input', function () { render(); saveState(); });
  nIn.addEventListener('change', function () { nIn.value = readNum(nIn, DEFAULTS.n); });
  lIn.addEventListener('change', function () { lIn.value = readNum(lIn, DEFAULTS.l); });
  Array.prototype.forEach.call(dirRadios, function (r) {
    r.addEventListener('change', function () { render(); saveState(); });
  });
  headerChk.addEventListener('change', function () { render(); saveState(); });
  Array.prototype.forEach.call(document.querySelectorAll('.presets button'), function (b) {
    b.addEventListener('click', function () {
      nIn.value = b.getAttribute('data-n');
      lIn.value = b.getAttribute('data-l');
      render();
      saveState();
    });
  });
  Array.prototype.forEach.call(swatches, function (b) {
    b.addEventListener('click', function () {
      setColor(b.getAttribute('data-color'), true);
    });
  });
  customColor.addEventListener('input', function () {
    if (/^#[0-9a-fA-F]{6}$/.test(customColor.value)) setColor(customColor.value, true);
  });
  window.addEventListener('resize', fitZoom);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  var T = window.GakusyuTransport;
  var GIS_CLIENT_ID = '920000857743-91jfqq1q45hmnas1b25ebg0dqafo846i.apps.googleusercontent.com';
  function getIdToken(){ return T ? T.getIdToken() : ''; }
  // site-gas/site-pdfdrop（新GAS）: YOUR_SCRIPT_ID_site-pdfdrop
  var WORKER_BASE = 'https://gakusyu-tools-proxy.hori-shota.workers.dev';
  var DIRECT_PDFDROP_URL = 'https://script.google.com/a/macros/hori-shota.com/s/AKfycbwj7qTaMDmKGa-KTEEwa2jcP7wtZ8xh_rVMANzfwKapz5u8tThqjxc2pQsbN-lAWU5L7Q/exec';
  var WORKER_PDFDROP_URL = (WORKER_BASE && WORKER_BASE.indexOf('REPLACE')===-1 && WORKER_BASE.indexOf('workers.dev')!==-1) ? WORKER_BASE.replace(/\/+$/,'') + '/pdfdrop' : '';
  var CLASSROOM_URL = WORKER_PDFDROP_URL || DIRECT_PDFDROP_URL;
  var CLASSROOM = {
    url: CLASSROOM_URL,
    token: 'e6135dfd707ab9a6916635fa'
  };
  if (T) T.configure({ origins: [WORKER_BASE] });

  function setStatus(msg) {
    document.getElementById('sendStatus').textContent = msg;
  }

  // TESTABLE-PDFGEN-START
  function loadScriptOnce(src, cb) {
    window.__loadedScripts = window.__loadedScripts || {};
    if (window.__loadedScripts[src]) { cb(); return; }
    var s = document.createElement('script');
    var done = false;
    var timer = null;
    function finish(err) {
      if (done) return;
      done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      try { s.onload = null; s.onerror = null; } catch (e) {}
      if (err) { try { s.remove(); } catch (e) {} }
      cb(err);
    }
    s.src = src;
    s.onload = function () {
      window.__loadedScripts[src] = true;
      finish();
    };
    s.onerror = function () { finish(new Error('load failed: ' + src)); };
    timer = setTimeout(function () { finish(new Error('load timeout: ' + src)); }, 20000);
    document.head.appendChild(s);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function buildPdfName(n, l, requestId) {
    if (T && T.buildPdfName) return T.buildPdfName(n, l, requestId);
    var d = new Date();
    // 秒まで同じでも request_id で一意にする（pollの同名誤成功を防ぐ）
    var tag = String(requestId || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 36) || String(Date.now());
    return 'genkoshi_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
      + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds())
      + '_' + tag + '_' + n + 'x' + l + '.pdf';
  }

  function makePdf(cb) {
    var finished = false;
    var timer = null;
    var initialZoom = sheet.style.zoom;
    function finish(err, pdf) {
      if (finished) return;
      finished = true;
      if (timer) { clearTimeout(timer); timer = null; }
      try { sheet.style.zoom = initialZoom; } catch (e) {}
      cb(err, pdf);
    }
    // CDN/画像化が無応答でもbuttonを永久disabledにしない
    timer = setTimeout(function () { finish(new Error('PDF生成がタイムアウトしました')); }, 90000);
    loadScriptOnce('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', function (e1) {
      if (finished) return;
      if (e1) { finish(e1); return; }
      loadScriptOnce('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js', function (e2) {
        if (finished) return;
        if (e2) { finish(e2); return; }
        sheet.style.zoom = 1;
        var rendering;
        try {
          rendering = html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', logging: false });
        } catch (err) {
          finish(err);
          return;
        }
        Promise.resolve(rendering).then(function (canvas) {
          if (finished) return;
          try {
            var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            var imgH = Math.min(297, 210 * canvas.height / canvas.width);
            var imgW = imgH * canvas.width / canvas.height;
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (210 - imgW) / 2, 0, imgW, imgH);
            finish(null, pdf);
          } catch (err) { finish(err); }
        }, function (err) { finish(err); });
      });
    });
  }
  // TESTABLE-PDFGEN-END

  /**
   * PDF送信。request_id は論理操作で1つだけ作り、Worker→Direct の再送でも同じ値を使う。
   * rid は同一送信operationの全iframeで共有し、postMessage応答を検証する。
   */
  // TESTABLE-PDF-START
  var pdfPendingUntil = 0;
  var pdfPendingUnknown = false;
  try {
    pdfPendingUntil = parseInt(sessionStorage.getItem('genko_pdf_pending_until') || '0', 10) || 0;
    pdfPendingUnknown = sessionStorage.getItem('genko_pdf_pending_unknown') === '1';
  } catch (e) {}
  function persistPdfPending() {
    try {
      sessionStorage.setItem('genko_pdf_pending_until', String(pdfPendingUntil));
      sessionStorage.setItem('genko_pdf_pending_unknown', pdfPendingUnknown ? '1' : '0');
    } catch (e) {}
  }
  function sendPdfToClassroom(b64, name, requestId, cb) {
    if (typeof requestId === 'function') { cb = requestId; requestId = ''; }
    if (!T) { cb({ ok: false, error: '通信ヘルパーが読み込まれていません' }); return; }
    if (!requestId) requestId = T.newRequestId();
    if (!T.isRequestId(requestId)) { cb({ ok: false, error: '内部エラー: request_id が不正です' }); return; }
    var rid = T.newNonce();
    var done = false;
    var overallTimer = null;
    var pollTimer = null;
    var pollAttempt = 0;
    var silentStreak = 0;

    function finish(res) {
      if (done) return;
      done = true;
      if (res && res.unknown) {
        pdfPendingUntil = Date.now() + 60000;
        pdfPendingUnknown = true;
        persistPdfPending();
      } else if (res && res.ok) {
        pdfPendingUnknown = false;
        pdfPendingUntil = 0;
        persistPdfPending();
      }
      if (overallTimer) { clearTimeout(overallTimer); overallTimer = null; }
      if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
      cb(res);
    }
    function buildPayload() {
      var p = { token: CLASSROOM.token, name: name, b64: b64, request_id: requestId };
      var idt = getIdToken();
      if (idt) p.id_token = idt;
      return p;
    }
    function postOnce(url, timeoutMs) {
      return T.postForm({
        url: url,
        payload: buildPayload(),
        rid: rid,
        kind: 'genko',
        timeoutMs: timeoutMs,
        requestIdRequired: true
      });
    }
    var postHadUnknown = false;
    var postInFlight = false;
    var authErrorSeen = false;
    var explicitPostError = '';
    function startPostAttempts() {
      var urls = WORKER_PDFDROP_URL ? [WORKER_PDFDROP_URL, DIRECT_PDFDROP_URL] : [DIRECT_PDFDROP_URL];
      var idx = 0;
      var startedAt = Date.now();
      function next() {
        if (done) return;
        if (idx >= urls.length) { postInFlight = false; return; } // 応答不明のままpollで確認する
        if (!getIdToken()) {
          postInFlight = false;
          finish({ ok: false, auth: true, error: 'ログインの有効期限が切れています。もう一度ログインしてください。' });
          return;
        }
        var url = urls[idx++];
        var remaining = 60000 - (Date.now() - startedAt);
        if (remaining <= 1000) { postInFlight = false; return; }
        postInFlight = true;
        postOnce(url, Math.min(30000, remaining)).then(function (res) {
          postInFlight = false;
          if (done) return;
          if (res && res.ok && res.data && typeof res.data === 'object') {
            if (res.data.ok === true) { finish({ ok: true, name: res.data.name || name }); return; }
            if (res.data.ok === false) {
              var msg = String(res.data.error || '');
              var code = String(res.data.code || '');
              if (/pending|processing|処理中|in_flight|unknown/i.test(msg) || /pending_unknown|in_flight|ledger_unavailable/i.test(code)) {
                // 処理中/結果不明: 再送せずpollでの確定を待つ（二重印刷防止）
                postHadUnknown = true;
                return;
              }
              // 先行attemptが不明なら、後続の明示エラーで「未保存」と確定しない
              if (postHadUnknown) {
                if (/bad token|not allowed|strict verification|auth/i.test(msg + ' ' + code)) authErrorSeen = true;
                else explicitPostError = msg || code || '送信に失敗しました';
                return;
              }
              if (/bad token|not allowed|strict verification|auth/i.test(msg + ' ' + code)) {
                finish({ ok: false, auth: true, error: msg || '保存先の認証に失敗しました。ログインし直してください。' });
                return;
              }
              finish({ ok: false, error: msg || '送信に失敗しました' });
              return;
            }
          }
          // 応答不明（timeout/5xx/JSONでない等） → 同一request_idのまま次のURLへ
          postHadUnknown = true;
          next();
        }, function () {
          postInFlight = false;
          if (done) return;
          postHadUnknown = true;
          next();
        });
      }
      next();
    }
    function pollUrl(base) {
      return base + '?poll=' + encodeURIComponent(name) + '&token=' + encodeURIComponent(CLASSROOM.token);
    }
    function scheduleNext(delay) {
      if (done) return;
      pollTimer = setTimeout(runPoll, delay);
    }
    function runPoll() {
      pollTimer = null;
      if (done) return;
      if (pollAttempt >= 20) {
        if (authErrorSeen && !postHadUnknown && !postInFlight && !explicitPostError) {
          finish({ ok: false, auth: true, error: '保存先の認証に失敗しました。ログインし直してください。' });
        } else {
          finish({ ok: false, unknown: true, error: T.messages.unknownResult });
        }
        return;
      }
      if (silentStreak >= 3) {
        // JSONP失敗/無応答はauthではなく結果不明（POST保存済みの可能性を消さない）
        finish({ ok: false, unknown: true, error: T.messages.unknownResult });
        return;
      }
      pollAttempt += 1;
      var bases = WORKER_PDFDROP_URL ? [WORKER_PDFDROP_URL, DIRECT_PDFDROP_URL] : [DIRECT_PDFDROP_URL];
      var i = 0;
      function tryBase() {
        if (done) return;
        if (i >= bases.length) {
          silentStreak += 1;
          scheduleNext(1500);
          return;
        }
        var base = bases[i++];
        T.jsonp(pollUrl(base), { timeoutMs: 6000 }).then(function (jp) {
          if (done) return;
          if (jp.ok && jp.data && jp.data.genkoPoll) {
            if (jp.data.found && jp.data.name === name) { finish({ ok: true, name: name }); return; }
            var err = jp.data.error ? String(jp.data.error) : '';
            if (/bad token/i.test(err)) {
              authErrorSeen = true;
              if (i < bases.length) { tryBase(); return; }
              if (!postHadUnknown && !postInFlight) {
                finish({ ok: false, auth: true, error: '保存先の認証に失敗しました。ログインし直してください。' });
                return;
              }
              scheduleNext(3000);
              return;
            }
            if (/folder not configured/i.test(err)) {
              if (i < bases.length) { tryBase(); return; }
              if (postHadUnknown || postInFlight) {
                explicitPostError = '保存先フォルダが未設定です（pdfdropのlast_errorを確認）';
                scheduleNext(3000);
                return;
              }
              finish({ ok: false, error: '保存先フォルダが未設定です（pdfdropのlast_errorを確認）' });
              return;
            }
            silentStreak = 0;
            scheduleNext(3000);
            return;
          }
          tryBase();
        });
      }
      tryBase();
    }

    setStatus('送信中(保存確認中…)');
    overallTimer = setTimeout(function () {
      finish({ ok: false, unknown: true, error: T.messages.unknownResult });
    }, 60000);
    startPostAttempts();
    runPoll();
  }
  // TESTABLE-PDF-END

  function probeAuth(cb) {
    if (!T) { cb({ state: 'noauth' }); return; }
    T.probeAuth({
      workerUrl: WORKER_PDFDROP_URL,
      directUrl: DIRECT_PDFDROP_URL,
      token: CLASSROOM.token,
      totalMs: 22000
    }).then(function (res) {
      if (res.status === 'ok') { cb({ state: 'ok', isOwner: !!res.isOwner }); return; }
      if (res.status === 'notallowed') { cb({ state: 'notallowed', masked: res.masked }); return; }
      if (res.status === 'noauth') { cb({ state: 'noauth' }); return; }
      if (res.status === 'error') { cb({ state: 'error', message: res.message }); return; }
      cb({ state: 'unreachable' });
    });
  }

  // 外部文字列を innerHTML に入れない（msgはtextContent、リンクはDOMで組立）
  function showAuthHelp(msg) {
    var statusEl = document.getElementById('sendStatus');
    if (!statusEl) return;
    statusEl.textContent = '';
    statusEl.appendChild(document.createTextNode(msg || 'Googleにログインされていない可能性があります。'));
    statusEl.appendChild(document.createTextNode(' '));
    var portalLink = document.createElement('a');
    portalLink.href = '../';
    portalLink.target = '_blank';
    portalLink.rel = 'noopener';
    portalLink.textContent = 'ポータルの教室用ログインを開く';
    statusEl.appendChild(portalLink);
    statusEl.appendChild(document.createTextNode('（ログイン後にもう一度押してください）'));
  }

  document.getElementById('classroomBtn').addEventListener('click', function () {
    var btn = this;
    if (btn.disabled) return;
    if (!T) { setStatus('通信ヘルパーが読み込まれていません。ページを再読み込みしてください。'); return; }
    if (Date.now() < pdfPendingUntil) {
      setStatus('前回の送信結果を確認中です。二重印刷を防ぐため、しばらく待って保存先を確認してください。');
      return;
    }
    if (pdfPendingUnknown) {
      var checked = window.confirm('前回の送信結果がまだ確定していません。保存先を確認しましたか？\n確認できた場合のみ「OK」で新しく印刷します。');
      if (!checked) {
        setStatus('前回の送信結果を確認してから、もう一度押してください。');
        return;
      }
      pdfPendingUnknown = false;
      pdfPendingUntil = 0;
      persistPdfPending();
    }
    btn.disabled = true;
    setStatus('認証確認中…');
    probeAuth(function (pr) {
      if (pr.state !== 'ok') {
        btn.disabled = false;
        if (pr.state === 'noauth') showAuthHelp('Googleにログインされていない可能性があります。');
        else if (pr.state === 'notallowed') setStatus('送信失敗: このアカウント(' + (pr.masked || '不明') + ')は許可リストにありません');
        else if (pr.state === 'unreachable') setStatus('送信失敗: 認証サーバーに接続できませんでした。通信状態を確認して、もう一度お試しください。');
        else setStatus('送信失敗: ' + (pr.message || '不明なエラー'));
        return;
      }
      // 期限切れ/欠落トークンは送信前に破棄済み。PDF POSTは strict 検証のため id_token 必須
      if (!getIdToken()) { btn.disabled = false; showAuthHelp('ログインの有効期限が切れています。'); return; }
      setStatus('PDFを生成中…');
      makePdf(function (err, pdf) {
        if (err) {
          btn.disabled = false;
          setStatus('PDF生成に失敗しました');
          return;
        }
        setStatus('送信中…');
        var n = readNum(nIn, DEFAULTS.n);
        var l = readNum(lIn, DEFAULTS.l);
        var requestId = T.newRequestId();
        var name = buildPdfName(n, l, requestId);
        sendPdfToClassroom(pdf.output('datauristring').split(',')[1], name, requestId, function (res) {
          btn.disabled = false;
          if (res && res.ok) { setStatus('送信完了: ' + (res.name || name)); return; }
          if (res && res.unknown) { setStatus(T.messages.unknownResult); return; }
          if (res && res.auth) { showAuthHelp(res.error); return; }
          var errText = String((res && res.error) || '');
          if (/not allowed|strict verification|token|auth/i.test(errText)) {
            showAuthHelp('このアカウントでは送信できません。教室用アカウントでログインし直してください。');
            return;
          }
          setStatus('送信失敗: ' + (errText || '不明なエラー'));
        });
      });
    });
  });

  // Pages静的版: 起動時にprobeで表示判定（仕様書_移行案.md 4.4）
  // - 未ログイン/教室外 → 非表示、教室/先生 → 表示（ログインはポータルの「教室用ログイン」で行う）
  var authExpiredNotice = false;
  function updateClassroomBtnVisibility() {
    var btn = document.getElementById('classroomBtn');
    if (!CLASSROOM.url || !CLASSROOM.token) return;
    if (location.protocol === 'file:') return;
    var hadToken = !!(T && T.peekIdToken && T.peekIdToken());
    probeAuth(function (pr) {
      if (pr.state === 'ok') {
        authExpiredNotice = false;
        btn.style.display = '';
        setStatus('');
      } else if (pr.state === 'notallowed') {
        btn.style.display = 'none';
        setStatus('教室外アカウントでは印刷できません');
      } else if (pr.state === 'error') {
        btn.style.display = 'none';
        showAuthHelp('ログイン情報を確認できませんでした。');
      } else if (pr.state === 'noauth' && (hadToken || authExpiredNotice)) {
        authExpiredNotice = true;
        btn.style.display = 'none';
        showAuthHelp('ログインの有効期限が切れています。');
      } else if (!authExpiredNotice) {
        btn.style.display = 'none';
        setStatus('');
      }
    });
  }
  window.__genkoTest = {
    makePdf: makePdf,
    classroom: CLASSROOM,
    probeAuth: probeAuth,
    updateClassroomBtnVisibility: updateClassroomBtnVisibility,
    sendPdfToClassroom: sendPdfToClassroom,
    buildPdfName: buildPdfName
  };
  if (T) T.onAuthChange(function () { updateClassroomBtnVisibility(); });

  // 起動時に判定（旧 isGasEnv 表示は廃止）
  updateClassroomBtnVisibility();

  applyState(loadState() || DEFAULTS);
  render();
})();
</script>
</body>
