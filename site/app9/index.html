<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原稿用紙作成</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  background: #ecefee;
  color: #2b2b2b;
}
.controls { max-width: 780px; margin: 18px auto 0; padding: 0 14px; }
.panel {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  padding: 16px 20px;
}
.panel h1 { font-size: 18px; margin: 0 0 14px; color: #20574a; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 12px; }
fieldset.dirs {
  border: 1px solid #ddd; border-radius: 8px; padding: 8px 16px 10px; margin: 0;
  display: flex; gap: 18px;
}
legend { font-size: 13px; color: #666; padding: 0 6px; }
.radio label { cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.field { display: flex; align-items: center; gap: 8px; font-size: 15px; }
input[type=number] {
  width: 76px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px;
  font-size: 15px; text-align: center;
}
.count { font-size: 14px; color: #20574a; font-weight: 600; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button {
  background: #f2f5f3; border: 1px solid #c8d2cc; border-radius: 6px;
  padding: 6px 12px; font-size: 14px; cursor: pointer;
}
.presets button:hover { background: #e2eae6; }
.swatches { display: flex; align-items: center; gap: 10px; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0;
}
.swatch.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #2e7d63; }
input[type=color] {
  width: 36px; height: 30px; padding: 2px;
  border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer;
}
.custom-label { font-size: 13px; color: #666; }
.chk { font-size: 15px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.actions button {
  font-size: 16px; padding: 10px 26px; border-radius: 8px; border: none;
  cursor: pointer; color: #fff;
}
#printBtn { background: #2e7d63; }
#printBtn:hover { background: #276a54; }
#classroomBtn { background: #b0713a; }
#classroomBtn:hover:not([disabled]) { background: #96602f; }
#classroomBtn[disabled] { opacity: .6; cursor: default; }
.sendStatus { font-size: 13px; color: #555; }
.hint { font-size: 12.5px; color: #777; margin: 10px 0 0; }

.page-wrap { overflow: auto; padding: 18px 0 48px; }
.sheet {
  width: 210mm; min-height: 297mm; background: #fff;
  margin: 0 auto; padding: 10mm;
  box-shadow: 0 3px 18px rgba(0,0,0,.16);
}

.doc-header { margin: 0 0 5mm; }
.dh-row { display: flex; align-items: flex-end; gap: 2.5mm; }
.dh-row.name { justify-content: flex-end; margin-top: 3.5mm; }
.dh-label {
  border: 0.35mm solid #444; color: #222; font-size: 11pt; line-height: 1;
  padding: 1.4mm 1.4mm 1.4mm 2.8mm; letter-spacing: .28em;
}
.dh-line { flex: 1 1 auto; border-bottom: 0.35mm solid #444; height: 6.5mm; }
.dh-row.name .dh-line { flex: 0 0 58mm; }

table.grid { border-collapse: collapse; table-layout: fixed; margin: 0 auto; }
table.grid td { border: 0.25mm solid var(--line-color, #bcd0c6); padding: 0; }

@media print {
  @page { size: A4 portrait; margin: 10mm; }
  body { background: #fff; }
  .no-print { display: none !important; }
  .page-wrap { overflow: visible; padding: 0; }
  .sheet {
    width: auto; min-height: auto; margin: 0; padding: 0;
    box-shadow: none; zoom: 1 !important;
  }
}
</style>
</head>
<body>

<div class="controls no-print">
  <div class="panel">
    <h1>原稿用紙作成</h1>

    <div class="row">
      <fieldset class="dirs">
        <legend>書き方向</legend>
        <span class="radio"><label><input type="radio" name="dir" value="tate">縦書き</label></span>
        <span class="radio"><label><input type="radio" name="dir" value="yoko" checked>横書き</label></span>
      </fieldset>
      <span class="field">1行のマス数 <input type="number" id="masu" value="20" min="1" max="50"></span>
      <span class="field">行数 <input type="number" id="gyo" value="20" min="1" max="50"></span>
      <span class="count" id="count"></span>
    </div>

    <div class="row presets">
      <button data-n="20" data-l="20">400字詰め(20×20)</button>
      <button data-n="20" data-l="10">200字詰め(20×10)</button>
      <button data-n="30" data-l="20">600字詰め(30×20)</button>
      <button data-n="10" data-l="10">100字詰め(10×10)</button>
    </div>

    <div class="row">
      <span class="field">罫線の色</span>
      <div class="swatches">
        <button class="swatch" data-color="#bcd0c6" title="緑(定番)" style="background:#bcd0c6"></button>
        <button class="swatch" data-color="#c8c8c8" title="グレー" style="background:#c8c8c8"></button>
        <button class="swatch" data-color="#bccde2" title="青" style="background:#bccde2"></button>
        <button class="swatch" data-color="#ecd0da" title="ピンク" style="background:#ecd0da"></button>
        <button class="swatch" data-color="#e3d6bf" title="ベージュ" style="background:#e3d6bf"></button>
        <input type="color" id="customColor" value="#bcd0c6" title="カスタムカラー">
        <span class="custom-label">カスタム</span>
      </div>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="headerChk" checked>題名・氏名欄を付ける</label>
    </div>

    <div class="actions">
      <button id="printBtn">印刷する</button>
      <button id="classroomBtn" style="display:none">教室タブレットで印刷</button>
      <span id="gis-wrap-app9" style="display:none;margin-left:8px"></span>
      <span class="sendStatus" id="sendStatus"></span>
    </div>
    <p class="hint">印刷ダイアログの保存先で「PDFに保存」を選ぶとPDFファイルも作成できます。どのサイズでも必ずA4用紙1枚に収まります。設定はこのブラウザに自動保存され、次回開いたときに復元されます。<br>※PDF出力には <a href="https://github.com/parallax/jsPDF" target="_blank" rel="noopener">jsPDF</a>・<a href="https://html2canvas.hertzen.com/" target="_blank" rel="noopener">html2canvas</a> (MIT License) を利用しています。</p>
  </div>
</div>

<div class="page-wrap">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  var KEY = 'genkoshi-settings-v2';
  var DEFAULTS = { dir: 'yoko', n: 20, l: 20, header: true, color: '#bcd0c6' };
  var sheet = document.getElementById('sheet');
  var nIn = document.getElementById('masu');
  var lIn = document.getElementById('gyo');
  var countLbl = document.getElementById('count');
  var headerChk = document.getElementById('headerChk');
  var dirRadios = document.querySelectorAll('input[name="dir"]');
  var swatches = document.querySelectorAll('.swatch');
  var customColor = document.getElementById('customColor');
  var MIN = 1, MAX = 50;
  var lastColor = DEFAULTS.color;

  function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
  function readNum(el, dflt) {
    var v = parseInt(el.value, 10);
    return Number.isFinite(v) ? clamp(v) : dflt;
  }
  function getDir() {
    for (var i = 0; i < dirRadios.length; i++) if (dirRadios[i].checked) return dirRadios[i].value;
    return 'tate';
  }

  function currentState() {
    return {
      dir: getDir(),
      n: readNum(nIn, DEFAULTS.n),
      l: readNum(lIn, DEFAULTS.l),
      header: headerChk.checked,
      color: lastColor
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return null;
      var st = {};
      st.dir = s.dir === 'yoko' || s.dir === 'tate' ? s.dir : DEFAULTS.dir;
      st.n = Number.isFinite(parseInt(s.n, 10)) ? clamp(parseInt(s.n, 10)) : DEFAULTS.n;
      st.l = Number.isFinite(parseInt(s.l, 10)) ? clamp(parseInt(s.l, 10)) : DEFAULTS.l;
      st.header = typeof s.header === 'boolean' ? s.header : DEFAULTS.header;
      st.color = /^#[0-9a-fA-F]{6}$/.test(String(s.color)) ? String(s.color).toLowerCase() : DEFAULTS.color;
      return st;
    } catch (e) { return null; }
  }

  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(currentState())); } catch (e) {}
  }

  function setColor(c, persist) {
    lastColor = String(c).toLowerCase();
    sheet.style.setProperty('--line-color', lastColor);
    customColor.value = lastColor;
    Array.prototype.forEach.call(swatches, function (b) {
      b.classList.toggle('active', b.getAttribute('data-color').toLowerCase() === lastColor);
    });
    if (persist) saveState();
  }

  function applyState(st) {
    document.querySelector('input[name="dir"][value="' + st.dir + '"]').checked = true;
    nIn.value = st.n;
    lIn.value = st.l;
    headerChk.checked = st.header;
    setColor(st.color, false);
  }

  function render() {
    var dir = getDir();
    var n = readNum(nIn, DEFAULTS.n);
    var l = readNum(lIn, DEFAULTS.l);
    countLbl.textContent = (n * l) + '字';

    var headerOn = headerChk.checked;
    var HEADER_MM = 24;
    var availW = 190, availH = 277 - (headerOn ? HEADER_MM : 0);
    var cols = dir === 'yoko' ? n : l;
    var rows = dir === 'yoko' ? l : n;
    var cell = Math.min(availW / cols, availH / rows);
    cell = Math.floor(cell * 100) / 100;

    var h = '';
    if (headerOn) {
      h += '<div class="doc-header">'
        + '<div class="dh-row"><span class="dh-label">題名</span><span class="dh-line"></span></div>'
        + '<div class="dh-row name"><span class="dh-label">氏名</span><span class="dh-line"></span></div>'
        + '</div>';
    }
    var cs = 'width:' + cell + 'mm;height:' + cell + 'mm;';
    var tds = '';
    for (var r = 0; r < rows; r++) {
      tds += '<tr>';
      if (dir === 'yoko') {
        for (var c = 0; c < cols; c++) tds += '<td style="' + cs + '"></td>';
      } else {
        for (var c2 = cols - 1; c2 >= 0; c2--) tds += '<td style="' + cs + '"></td>';
      }
      tds += '</tr>';
    }
    h += '<table class="grid" style="width:' + (cell * cols) + 'mm">' + tds + '</table>';
    sheet.innerHTML = h;
    fitZoom();
  }

  function fitZoom() {
    var BASE = 210 * 96 / 25.4;
    var avail = document.documentElement.clientWidth - 16;
    var z = Math.min(1, avail / BASE);
    sheet.style.zoom = z < 1 ? z : 1;
  }

  nIn.addEventListener('input', function () { render(); saveState(); });
  lIn.addEventListener('input', function () { render(); saveState(); });
  nIn.addEventListener('change', function () { nIn.value = readNum(nIn, DEFAULTS.n); });
  lIn.addEventListener('change', function () { lIn.value = readNum(lIn, DEFAULTS.l); });
  Array.prototype.forEach.call(dirRadios, function (r) {
    r.addEventListener('change', function () { render(); saveState(); });
  });
  headerChk.addEventListener('change', function () { render(); saveState(); });
  Array.prototype.forEach.call(document.querySelectorAll('.presets button'), function (b) {
    b.addEventListener('click', function () {
      nIn.value = b.getAttribute('data-n');
      lIn.value = b.getAttribute('data-l');
      render();
      saveState();
    });
  });
  Array.prototype.forEach.call(swatches, function (b) {
    b.addEventListener('click', function () {
      setColor(b.getAttribute('data-color'), true);
    });
  });
  customColor.addEventListener('input', function () {
    if (/^#[0-9a-fA-F]{6}$/.test(customColor.value)) setColor(customColor.value, true);
  });
  window.addEventListener('resize', fitZoom);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  var GIS_CLIENT_ID = '920000857743-91jfqq1q45hmnas1b25ebg0dqafo846i.apps.googleusercontent.com';
  function getIdToken(){ try{ return localStorage.getItem('gis_id_token')||''; }catch(e){ return ''; } }
  function setIdToken(t){ try{ if(t) localStorage.setItem('gis_id_token',t); else localStorage.removeItem('gis_id_token'); }catch(e){} }
  function getEmailFromIdToken(idt){ try{ var p=idt.split('.')[1]; p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='='; var j=JSON.parse(atob(p)); return j.email||''; }catch(e){ return ''; } }
  // site-gas/site-pdfdrop（新GAS）: YOUR_SCRIPT_ID_site-pdfdrop
  var WORKER_BASE = 'https://gakusyu-tools-proxy.hori-shota.workers.dev';
  var DIRECT_PDFDROP_URL = 'https://script.google.com/a/macros/hori-shota.com/s/AKfycbwj7qTaMDmKGa-KTEEwa2jcP7wtZ8xh_rVMANzfwKapz5u8tThqjxc2pQsbN-lAWU5L7Q/exec';
  var WORKER_PDFDROP_URL = (WORKER_BASE && WORKER_BASE.indexOf('REPLACE')===-1 && WORKER_BASE.indexOf('workers.dev')!==-1) ? WORKER_BASE.replace(/\/+$/,'') + '/pdfdrop' : '';
  var CLASSROOM_URL = WORKER_PDFDROP_URL || DIRECT_PDFDROP_URL;
  var CLASSROOM = {
    url: CLASSROOM_URL,
    token: 'e6135dfd707ab9a6916635fa'
  };
  var isGasEnv = typeof google !== 'undefined' && google.script && google.script.run;

  function setStatus(msg) {
    document.getElementById('sendStatus').textContent = msg;
  }

  function loadScriptOnce(src, cb) {
    window.__loadedScripts = window.__loadedScripts || {};
    if (window.__loadedScripts[src]) { cb(); return; }
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { window.__loadedScripts[src] = true; cb(); };
    s.onerror = function () { cb(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function buildPdfName(n, l) {
    var d = new Date();
    return 'genkoshi_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
      + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds())
      + '_' + n + 'x' + l + '.pdf';
  }

  function makePdf(cb) {
    loadScriptOnce('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', function (e1) {
      if (e1) { cb(e1); return; }
      loadScriptOnce('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js', function (e2) {
        if (e2) { cb(e2); return; }
        var prevZoom = sheet.style.zoom;
        sheet.style.zoom = 1;
        html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', logging: false }).then(function (canvas) {
          sheet.style.zoom = prevZoom;
          try {
            var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            var imgH = Math.min(297, 210 * canvas.height / canvas.width);
            var imgW = imgH * canvas.width / canvas.height;
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (210 - imgW) / 2, 0, imgW, imgH);
            cb(null, pdf);
          } catch (err) { cb(err); }
        }).catch(function (err) {
          sheet.style.zoom = prevZoom;
          cb(err);
        });
      });
    });
  }

  function sendPdfToClassroom(b64, name, cb) {
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.name = '__dropframe' + Date.now();
    document.body.appendChild(iframe);
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = CLASSROOM.url;
    form.target = iframe.name;
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'data';
    var idt2=getIdToken(); var payload={ token: CLASSROOM.token, name: name, b64: b64 }; if(idt2) payload.id_token=idt2;
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);
    var done = false;
    var hasRetriedDirectPost = false;
    var timer = setTimeout(function () { finish({ ok: false, error: 'タイムアウトしました' }); }, 60000);
    function onMsg(ev) {
      if (ev.data && ev.data.genko) finish(ev.data.payload || ev.data);
    }
    window.addEventListener('message', onMsg);
    form.submit();
    setStatus('送信中(保存確認中…)');
    pollForFile(name, 0, 0);
    function retryDirectPostIfNeeded(){
      if(hasRetriedDirectPost || !WORKER_PDFDROP_URL) return;
      hasRetriedDirectPost=true;
      try{
        var iframe2=document.createElement('iframe');
        iframe2.style.display='none';
        iframe2.name='__dropframeRetry'+Date.now();
        document.body.appendChild(iframe2);
        var form2=document.createElement('form');
        form2.method='POST';
        form2.action=DIRECT_PDFDROP_URL;
        form2.target=iframe2.name;
        var inp2=document.createElement('input');
        inp2.type='hidden'; inp2.name='data';
        var idtR=getIdToken(); var payloadR={ token: CLASSROOM.token, name: name, b64: b64 }; if(idtR) payloadR.id_token=idtR;
        inp2.value=JSON.stringify(payloadR);
        form2.appendChild(inp2);
        document.body.appendChild(form2);
        form2.submit();
        setTimeout(function(){ try{ iframe2.remove(); }catch(e){} try{ form2.remove(); }catch(e){} }, 7500);
      }catch(e){}
    }

    function buildPollUrl(base, n){ return base + '?poll=' + encodeURIComponent(n) + '&token=' + encodeURIComponent(CLASSROOM.token); }
    function pollForFileWithBase(base, n, attempt, silentStreak, cbDone){
      var s = document.createElement('script');
      var answered = false;
      var cbName='__genkoPoll'+Date.now()+Math.random().toString(36).slice(2);
      window[cbName] = function (res) {
        if (answered) return;
        answered = true;
        try{ s.remove(); }catch(e){}
        try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
        if (done) return;
        if (res && res.genkoPoll && res.found && res.name === n) finish({ ok: true, name: n });
        else setTimeout(function () { pollForFile(n, attempt + 1, 0); }, 3000);
      };
      s.onerror = function () {
        if (answered) return;
        answered = true;
        try{ s.remove(); }catch(e){}
        try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
        cbDone(false);
      };
      var to=setTimeout(function () {
        if (answered) return;
        answered = true;
        try{ s.remove(); }catch(e){}
        try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
        cbDone(false);
      }, 6000);
      // wrap success to clear timeout
      var orig=window[cbName];
      window[cbName]=function(res){ clearTimeout(to); orig(res); };
      s.src = buildPollUrl(base, n) + '&callback='+cbName+'&t=' + Date.now();
      document.head.appendChild(s);
    }
    function pollForFile(n, attempt, silentStreak) {
      if (done) return;
      if (silentStreak >= 3) {
        finish({ ok: false, auth: true, error: 'Googleへの接続が確認できません。ログイン状態を確認してください。' });
        return;
      }
      if (attempt >= 20) {
        finish({ ok: false, error: '保存を確認できませんでした(pdfdropステータスページのlast_errorを確認)' });
        return;
      }
      if(WORKER_PDFDROP_URL){
        pollForFileWithBase(WORKER_PDFDROP_URL, n, attempt, silentStreak, function(ok){
          if(done) return;
          if(!ok){
            if(!hasRetriedDirectPost) retryDirectPostIfNeeded();
            // worker poll failed -> try direct once before counting silentStreak
            pollForFileWithBase(DIRECT_PDFDROP_URL, n, attempt, silentStreak, function(ok2){
              if(ok2) return; // already handled via finish or next poll inside
              // both failed -> count as silent
              setTimeout(function () { pollForFile(n, attempt + 1, silentStreak + 1); }, 1500);
            });
          }
        });
      } else {
        pollForFileWithBase(CLASSROOM.url, n, attempt, silentStreak, function(ok){
          if(!ok) setTimeout(function () { pollForFile(n, attempt + 1, silentStreak + 1); }, 1500);
        });
      }
    }

    function finish(res) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      window.removeEventListener('message', onMsg);
      setTimeout(function () { iframe.remove(); form.remove(); }, 200);
      cb(res);
    }
  }

  function doProbePostApp9For(base, cb){
    var id=getIdToken();
    var em=id? (function(){ try{ var p=id.split('.')[1]; p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='='; var j=JSON.parse(atob(p)); return j.email||''; }catch(e){ return ''; } })() : '';
    var payload={ probe:1, token:CLASSROOM.token };
    if(id) payload.id_token=id;
    if(em) payload.email=em;
    var iframe=document.createElement('iframe');
    iframe.style.display='none';
    iframe.name='__probeApp9'+Date.now()+Math.random().toString(36).slice(2);
    document.body.appendChild(iframe);
    var form=document.createElement('form');
    form.method='POST';
    form.action=base;
    form.target=iframe.name;
    var inp=document.createElement('input');
    inp.type='hidden'; inp.name='data'; inp.value=JSON.stringify(payload);
    form.appendChild(inp);
    document.body.appendChild(form);
    var done=false;
    var t=setTimeout(function(){ if(done) return; done=true; try{ iframe.remove(); }catch(e){} try{ form.remove(); }catch(e){} cb(null); },8000);
    function onMsg(e){ if(!e.data||!e.data.genkoProbe) return; var res=e.data.payload||e.data; if(done) return; done=true; clearTimeout(t); window.removeEventListener('message',onMsg); try{ iframe.remove(); }catch(e){} try{ form.remove(); }catch(e){} cb(res); }
    window.addEventListener('message',onMsg);
    try{ form.submit(); }catch(e){ clearTimeout(t); window.removeEventListener('message',onMsg); try{ iframe.remove(); }catch(_e){} try{ form.remove(); }catch(_e){} cb(null); }
  }
  function doProbePostApp9(cb){ return doProbePostApp9For(CLASSROOM.url, cb); }
  function doProbePostApp9WithFallback(cb){
    if(!WORKER_PDFDROP_URL){ doProbePostApp9For(DIRECT_PDFDROP_URL, cb); return; }
    var settled=false;
    var tf=setTimeout(function(){ if(settled) return; settled=true; doProbePostApp9For(DIRECT_PDFDROP_URL, cb); }, 8500);
    doProbePostApp9For(WORKER_PDFDROP_URL, function(res){
      if(settled) return;
      if(res && res.genkoProbe){ clearTimeout(tf); settled=true; cb(res); return; }
      clearTimeout(tf); settled=true; doProbePostApp9For(DIRECT_PDFDROP_URL, cb);
    });
  }
  function jsonpGetFor(base, query, timeoutMs, cb) {
    var s = document.createElement('script');
    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      try{ s.remove(); }catch(e){}
      cb(null);
    }, timeoutMs);
    var cbName='__genkoJsonp'+Date.now()+Math.random().toString(36).slice(2);
    window[cbName] = function (res) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try{ s.remove(); }catch(e){}
      try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
      cb(res);
    };
    s.onerror = function () { if (settled) return; settled = true; clearTimeout(timer); try{ s.remove(); }catch(e){} try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; } cb(null); };
    s.src = base + query + '&callback='+cbName+'&t=' + Date.now();
    document.head.appendChild(s);
  }
  function jsonpGet(query, timeoutMs, cb) {
    var idt=getIdToken();
    if(idt && idt.length >= 1800){
      return doProbePostApp9WithFallback(cb);
    }
    if(idt){
      var q2=query + '&id_token=' + encodeURIComponent(idt);
      var em2=getEmailFromIdToken(idt); if(em2) q2+='&email='+encodeURIComponent(em2);
      if(WORKER_PDFDROP_URL){
        var wQDone2=false;
        var wTimer2=setTimeout(function(){ if(wQDone2) return; wQDone2=true; jsonpGetFor(DIRECT_PDFDROP_URL, q2, timeoutMs, cb); }, 8500);
        jsonpGetFor(WORKER_PDFDROP_URL, q2, timeoutMs, function(res){
          if(wQDone2) return;
          if(res && res.genkoProbe){ clearTimeout(wTimer2); wQDone2=true; cb(res); return; }
          if(res && res.ok!==undefined){ clearTimeout(wTimer2); wQDone2=true; cb(res); return; }
          clearTimeout(wTimer2); wQDone2=true; jsonpGetFor(DIRECT_PDFDROP_URL, q2, timeoutMs, cb);
        });
        return;
      }
      return jsonpGetFor(CLASSROOM.url, q2, timeoutMs, cb);
    }
    if(WORKER_PDFDROP_URL){
      var wQDone=false;
      var wTimer=setTimeout(function(){ if(wQDone) return; wQDone=true; jsonpGetFor(DIRECT_PDFDROP_URL, query, timeoutMs, cb); }, 8500);
      jsonpGetFor(WORKER_PDFDROP_URL, query, timeoutMs, function(res){
        if(wQDone) return;
        if(res && res.genkoProbe){ clearTimeout(wTimer); wQDone=true; cb(res); return; }
        if(res && res.ok!==undefined){ clearTimeout(wTimer); wQDone=true; cb(res); return; }
        clearTimeout(wTimer); wQDone=true; jsonpGetFor(DIRECT_PDFDROP_URL, query, timeoutMs, cb);
      });
      return;
    }
    return jsonpGetFor(CLASSROOM.url, query, timeoutMs, cb);
  }
  function jsonpGetWithFallbackCheck(query, timeoutMs, cb){
    return jsonpGet(query, timeoutMs, cb);
  }

  function probeAuth(cb) {
    var idt=getIdToken();
    if(idt && idt.length >= 1800){
      doProbePostApp9WithFallback(function(res){
        if (!res || !res.genkoProbe) { cb({ state: 'noauth' }); return; }
        if (!res.ok) { cb({ state: 'error', message: res.error }); return; }
        if (!res.allowed) { cb({ state: 'notallowed', masked: res.masked }); return; }
        cb({ state: 'ok' });
      });
      return;
    }
    // short id_token or no id_token -> JSONP via worker (like debug, 1256ms success)
    jsonpGet('?probe=1&token=' + encodeURIComponent(CLASSROOM.token), 7500, function (res) {
      if (!res || !res.genkoProbe) { cb({ state: 'noauth' }); return; }
      if (!res.ok) { cb({ state: 'error', message: res.error }); return; }
      if (!res.allowed) { cb({ state: 'notallowed', masked: res.masked }); return; }
      cb({ state: 'ok' });
    });
  }

  function showAuthHelp(msg) {
    document.getElementById('sendStatus').innerHTML =
      msg
      + ' <a href="' + CLASSROOM.url + '" target="_blank" rel="noopener">ログインページを開く</a>'
      + '(ログイン後にもう一度押してください)';
  }

  document.getElementById('classroomBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    setStatus('認証確認中…');
    probeAuth(function (pr) {
      if (pr.state !== 'ok') {
        btn.disabled = false;
        if (pr.state === 'noauth') showAuthHelp('Googleにログインされていない可能性があります。');
        else if (pr.state === 'notallowed') setStatus('送信失敗: このアカウント(' + (pr.masked || '不明') + ')は許可リストにありません');
        else setStatus('送信失敗: ' + pr.message);
        return;
      }
      setStatus('PDFを生成中…');
      makePdf(function (err, pdf) {
        if (err) {
          btn.disabled = false;
          setStatus('PDF生成に失敗しました');
          return;
        }
        setStatus('送信中…');
        var n = readNum(nIn, DEFAULTS.n);
        var l = readNum(lIn, DEFAULTS.l);
        sendPdfToClassroom(pdf.output('datauristring').split(',')[1], buildPdfName(n, l), function (res) {
          btn.disabled = false;
          if (res && res.ok) setStatus('送信完了: ' + res.name);
          else if (res && res.auth) showAuthHelp(res.error);
          else setStatus('送信失敗: ' + ((res && res.error) || '不明なエラー'));
        });
      });
    });
  });

  // Pages静的版: 起動時にprobeで表示判定（仕様書_移行案.md 4.4）GIS対応
  function initGisApp9(){
    if(GIS_CLIENT_ID.indexOf('REPLACE')===0) return;
    if(typeof google==='undefined'||!google.accounts||!google.accounts.id) { setTimeout(initGisApp9,500); return; }
    try{
      google.accounts.id.initialize({
        client_id: GIS_CLIENT_ID,
        callback: function(resp){ if(resp.credential){ setIdToken(resp.credential); updateClassroomBtnVisibility(); } },
        auto_select:false, cancel_on_tap_outside:true
      });
      var w=document.getElementById('gis-wrap-app9');
      if(w){ w.style.display='inline-block'; google.accounts.id.renderButton(w,{theme:'outline',size:'small',text:'signin_with',shape:'pill'}); }
    }catch(e){}
  }
  // Pages静的版: 起動時にprobeで表示判定（仕様書_移行案.md 4.4）
  // - 未ログイン → GIS表示、教室外 → 非表示、教室/先生 → 表示
  function updateClassroomBtnVisibility() {
    var btn = document.getElementById('classroomBtn');
    var gisW=document.getElementById('gis-wrap-app9');
    if (!CLASSROOM.url || !CLASSROOM.token) return;
    if (location.protocol === 'file:') return;
    probeAuth(function (pr) {
      if (pr.state === 'ok') {
        btn.style.display = '';
        if(gisW) gisW.style.display='none';
        setStatus('');
      } else if (pr.state === 'notallowed') {
        btn.style.display = 'none';
        if(gisW) gisW.style.display='none';
        setStatus('教室外アカウントでは印刷できません');
      } else {
        btn.style.display = 'none';
        if(GIS_CLIENT_ID.indexOf('REPLACE')!==0) initGisApp9();
      }
    });
  }
  // 起動時に判定（旧 isGasEnv 表示は廃止）
  updateClassroomBtnVisibility();
  window.__genkoTest = { makePdf: makePdf, classroom: CLASSROOM, probeAuth: probeAuth, updateClassroomBtnVisibility: updateClassroomBtnVisibility };

  applyState(loadState() || DEFAULTS);
  render();
})();
</script>
