    <clipPath id="bodyClip">
      <path d="M196 62 L170.5 62 A18.5 18.5 0 0 0 133.5 62 L70.5 62 A18.5 18.5 0 0 0 33.5 62 L7 62 C4.5 62 3.5 59 4.5 55 L6.5 50.5 C9 47.6 14 46.2 20 45.4 L33 43.8 C41 42.8 44 40.2 47 35.6 L60.5 20.5 C64.5 18.1 70 17 78 16.8 L108 16.8 C117 16.8 123 17.8 127.5 20.8 L143 36.2 C146.5 39.8 151 41.8 158 42.6 L178 44.2 C187 45.2 192.5 47.2 194.5 50.8 C196.2 53.8 196.5 58 196 62 Z"/>
    </clipPath>
