  <path d="M72 24.5 C76 22.8 80 22.2 85 22.2" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <path d="M106 22.4 C112 22.8 118 24.8 122 28.2" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>

