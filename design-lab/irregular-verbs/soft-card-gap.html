  比較用: soft-card.html（試作A カード型）の複製。
    型グループ見出し行の直前に、罫線・背景・表の線のない空白行
    <tr class="grp-gap"> を各 tbody 先頭へ入れた版（見出し前の余白を比較する）。

    「4. 発展 28語」の表（28行）
  を原形・過去形・過去分詞・意味・型の5列のまま転記し、
  末尾に lv（1=基本 / 2=発展）だけを付与している。
  カタカナ発音（PRON）は別途与えられた目安表をそのまま転記したもので、
  DATA の b（原形）をキーにしている。

  紙面: A4横（297×210mm）・1ページ3表（5列）・全2ページ。
    列内は table 1つ（thead は1回だけ）に tbody を並べ、
    型グループは tbody 先頭の colspan 見出し行（グレー帯）で示す。
  通し番号: 表示順に 1〜102（# 列。基本1〜74 / 発展75〜102）。
  発音: 原形・過去形・過去分詞の各セル右端にカタカナ（6.75pt・目安）を右揃えで添える。

  ▼ 再生成・更新時の注意
  1. Markdown の表の内容（綴り・「/」併記・意味の「／」区切り・型）は改変しない。
     表の行をそのまま貼り替え、lv を 1/2 で振り直す。
  2. 型が「A-B-B / A-B-C」のように複数ある語（get）は、
     先頭の型（A-B-B）をグループ分けに使い、表示は原資料の表記のまま。
  3. be / do / have の原形は原資料どおり括弧付き（be (am/is/are) 等）で保持する。
  4. PRON のキーは DATA の b と完全一致させる（語を足したら発音も足す）。
  5. 組版はA4横（297×210mm）・2列・2ページ固定。左列→右列→次ページの順に流し込み、
     収まらない場合は STEPS の文字サイズ・行間・余白を段階的に詰めて再構築する

  ============================================================

<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --font-gothic:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
    /* 組版（JSが STEPS で上書きする。ここは初期値） */
    --fs-form:8pt;
    --fs-pron:6pt;
    --fs-mean:7.5pt;
    --fs-title:7.6pt;
    --pad-v:0.7mm;
    --title-pad:0.55mm;
    --lh:1.2;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:#e9e9e9;
    color:#1a1a1a;
    font-family:var(--font-gothic);
    overflow-x:hidden;
  }
  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- ツールバー（印刷時は非表示） ---------- */
  .toolbar{
    position:static;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
    padding:10px 16px;
    background:#fff;
    border-bottom:1px solid #c9c9c9;
    font-size:13px;
    line-height:1.5;
  }
  .toolbar__title{font-weight:700;font-size:14px;margin:0}
  .toolbar__note{margin:0;color:#5a5a5a;font-size:12px}
  .toolbar__count{margin:0;color:#3a3a3a;font-size:12px;font-variant-numeric:tabular-nums}
  .toolbar__variant{
    margin:0;padding:1px 8px;
    font-size:12px;font-weight:700;color:#444;
    border:1px solid #c9c9c9;border-radius:3px;
  }
  .toolbar__spacer{margin-left:auto}
  .btn-print{
    font-family:inherit;font-size:13px;font-weight:700;
    padding:7px 18px;
    color:#fff;background:#222;
    border:1px solid #222;border-radius:3px;
    cursor:pointer;
  }
  .btn-print:hover{background:#000}
  .btn-print:focus-visible{outline:3px solid #4a90d9;outline-offset:2px}

  /* ---------- 紙面（A4横 297×210mm） ---------- */
  .doc{
    display:flex;flex-direction:column;align-items:center;
    gap:24px;
    padding:24px 0 48px;
  }
  .sheet{
    width:297mm;
    height:210mm;
    flex:0 0 auto;
    display:flex;flex-direction:column;
    padding:9mm 10mm 7mm;
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    font-size:var(--fs-form);
    line-height:1.2;
    overflow:hidden;
  }
  .sheet__head{
    flex:0 0 auto;
    display:flex;align-items:baseline;justify-content:space-between;gap:8mm;
    padding-bottom:1.4mm;
    border-bottom:0.4mm solid var(--ink);
  }
  .sheet__brand{margin:0;font-size:9.5pt;font-weight:700;letter-spacing:.08em}
  .sheet__level{margin:0;font-size:9pt;font-weight:700;letter-spacing:.1em}
  .sheet__legend{
    flex:0 0 auto;
    margin:0;
    padding-top:1.1mm;
    font-size:6.5pt;
    line-height:1.4;
    letter-spacing:0;
    color:#222;
  }
  .sheet__legend:empty{display:none}
  .sheet__cols{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr); /* JSが列数に合わせて上書き */
    column-gap:3.5mm;
    padding-top:1.6mm;
  }
  .col{min-width:0;min-height:0;overflow:hidden}
  .sheet__foot{
    flex:0 0 auto;
    display:flex;justify-content:space-between;gap:6mm;
    padding-top:1.1mm;
    border-top:0.2mm solid #8a8a8a;
    font-size:6.6pt;
    color:#222;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 表 ---------- */
  .tbl{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:var(--fs-form);
    line-height:var(--lh);
  }
  .tbl th,.tbl td{
    border:0.15mm solid var(--ink);
    padding:var(--pad-v) 0.6mm;
    text-align:left;
    vertical-align:top;
  }
  .tbl thead th{
    background:#e6e6e6;
    font-size:calc(var(--fs-form) - 0.7pt);
    font-weight:700;
    letter-spacing:.04em;
    padding:0.5mm 1.1mm;
    white-space:nowrap;
    vertical-align:middle;
  }
  /* 型グループ見出し行 */
  .tbl tr.grp > th{
    background:#e6e6e6;
    border-left:1mm solid var(--ink);
    font-size:var(--fs-title);
    font-weight:700;
    letter-spacing:.02em;
    padding:var(--title-pad) 1.2mm;
  }
  .tbl tbody tr:not(.grp):nth-of-type(even){background:#f7f7f7}
  .grp-count{font-weight:400;font-size:calc(var(--fs-title) - 0.6pt)}

  /* 通し番号 */
  .no{
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-size:calc(var(--fs-form) - 1.5pt);
    color:#333;
    padding-right:1.3mm !important;
    padding-left:0.4mm !important;
  }

  /* 変化形セル（語のすぐ下にカタカナ発音を右揃えで縦積み。語は折返し可） */
  .cell{display:block}
  .word{display:block;white-space:normal;overflow-wrap:break-word;word-break:normal;font-weight:700}
  .pron{
    display:block;
    white-space:nowrap;
    text-align:left;
    margin-left:0;
    font-weight:300;
    font-size:var(--fs-pron);
    color:#222;
    line-height:1.15;
  }
  .tbl td,.tbl th{padding-top:calc(var(--pad-v) - 0.15mm);padding-bottom:calc(var(--pad-v) - 0.15mm)}
  .mean{
    white-space:normal;
    word-break:break-word;
    font-size:var(--fs-mean);
    line-height:1.25;
  }

  /* ---------- 試作A: カード型・横線だけ ---------- */
  .tbl-card{
    border:0.2mm solid #c9c9c9;
    border-radius:3mm;
    overflow:hidden;            /* 印刷でも角丸でクリップする */
    background:var(--paper);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .tbl-card .tbl{width:100%}
  .tbl-card .tbl th,
  .tbl-card .tbl td{
    border:0;
    border-bottom:0.12mm solid #cfcfcf;   /* 横線のみ */
    padding-top:max(calc(var(--pad-v) - 0.15mm), 0.75mm);
    padding-bottom:max(calc(var(--pad-v) - 0.15mm), 0.75mm);
  }
  .tbl-card .tbl thead th{
    background:#f4f4f4;
    border-bottom:0.12mm solid #d0d0d0;
  }
  .tbl-card .tbl tr.grp > th{
    background:#f2f2f2;
    border-left:0;                        /* 太い黒アクセントを廃止 */
    border-top:0.12mm solid #d0d0d0;      /* 細い上線のみ */
    border-bottom:0.12mm solid #cfcfcf;
  }
  .tbl-card .tbl tbody tr:not(.grp):nth-of-type(even){background:transparent} /* ゼブラなし */
  .tbl-card .no{color:#666}
  /* 外周は wrapper の線に任せる（下端の二重線を避ける） */
  .tbl-card .tbl tbody:last-child tr:last-child > *{border-bottom:0}

  /* ---------- 試作A＋余白: 見出し直前の無地の余白行 ---------- */
  .grp-gap > td{
    border:0 !important;
    padding:0 !important;
    height:1.6mm;
    line-height:0;
    font-size:0;
    background:transparent !important;
  }

  /* ---------- 実測用・画面幅 ---------- */
  #pageProbe{position:absolute;top:0;left:-10000px;width:297mm;height:1px}
  .measure{
    position:absolute;top:0;left:-10000px;
    visibility:hidden;pointer-events:none;
    font-size:var(--fs-form);
    line-height:var(--lh);
  }

  /* ---------- 印刷（A4横） ---------- */
  @media print{
    @page{size:A4 landscape;margin:0}
    html,body{background:#fff}
    body{overflow:visible}
    .toolbar{display:none !important}
    .doc{
      display:block;
      padding:0;
      gap:0;
      zoom:1 !important;
    }
    .sheet{
      box-shadow:none !important;
      margin:0;
      width:297mm;
      height:210mm;
      break-inside:avoid;
      break-after:page;
      page-break-after:always;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .sheet:last-child{break-after:auto;page-break-after:auto}
    #pageProbe,.measure{display:none !important}
  }
</style>
</head>

  function build(step) {

    var quotas = [];
    var baseQ = Math.floor(totalRows / cols.length);

      var usedRows = 0;

          } else {

          }
        }
        /* 見出しすら入らない → 次の列へ（空の列なら1行だけ置いて前進） */
        if (capK === 0) {

        }

        var k = Math.min(capK, quotaRoom > 0 ? quotaRoom : capK);

        /* グループ末尾に1行だけ残さない */
        if (rowsLeft - k === 1 && k + 1 <= capK) k += 1;

        /* 列末に1行だけの断片を置かない */
        if (k < 2 && k < rowsLeft && tbodies.length > 0) break;

        /* 見出し＋1行だけの塊を作らない */
        if (ii === 0 && rowsLeft > 1 && k < 2) {
          if (tbodies.length && k + 1 > capK) break;
          if (k + 1 <= capK) k = 2;
        }

        tbodies.push(tbodyHTML(g, ii, ii + k, cont));
        usedRows += k;
        ii += k;
        if (ii >= g.items.length) {

          ii = 0;
        }

    var fits = gi >= ORDER.length;

    /* 列をまたぐグループの見出しに「全n語・i/N」を付ける */
    var tbs = [].slice.call(doc.querySelectorAll("tbody[data-group]"));
    var bi = 0;
    while (bi < tbs.length) {
      var key = tbs[bi].getAttribute("data-group");
      var bj = bi;
      while (bj + 1 < tbs.length && tbs[bj + 1].getAttribute("data-group") === key) bj += 1;
      var parts = bj - bi + 1;
      if (parts > 1) {
        var gTotal = tbs[bi].getAttribute("data-total");
        for (var bk = bi; bk <= bj; bk += 1) {
          var sp = tbs[bk].querySelector(".grp-count");
          if (!sp) continue;
          var partNo = bk - bi + 1;
          sp.textContent = partNo === 1
            ? "（全" + gTotal + "語・1/" + parts + "）"
            : "（続き・" + partNo + "/" + parts + "）";
        }
      }
      bi = bj + 1;
    }

    /* ページ見出し（そのページに含まれるレベル）とページ番号 */
    pages.forEach(function (pg, idx) {
      var seen = [];
      [].forEach.call(pg.el.querySelectorAll("tbody[data-group]"), function (tb) {
        var lvName = tb.getAttribute("data-group").split("|")[0];
        if (seen.indexOf(lvName) < 0) seen.push(lvName);
      });
      pg.level.textContent = seen.join("・");
      pg.pageno.textContent = (idx + 1) + " / " + pages.length;
    });

    /* はみ出し検査（縦） */
    var overflow = 0;
    cols.forEach(function (col) {
      if (col.scrollHeight > col.clientHeight + 1) overflow += 1;
    });

    /* 見切れ検査（横）: 語・発音・意味がセル幅を超えていないか */
    var clipped = 0;
    [].forEach.call(doc.querySelectorAll(".word, .pron, .mean"), function (el) {
      if (el.scrollWidth > el.clientWidth + 1) clipped += 1;
    });

    return { pages: pages, fits: fits, overflow: overflow, clipped: clipped };
  }

  /* 収まるまで段階的に詰める（縦はみ出し・横の見切れが0になる最大段階） */
  var result = null;
  for (var si = 0; si < STEPS.length; si += 1) {
    result = build(STEPS[si]);
    if (result.fits && !result.overflow && !result.clipped) break;
  }
  if (!result.fits || result.overflow || result.clipped) {
    console.warn("[irregular-verbs] 2ページに収まらない/見切れあり:",
      { fits: result.fits, overflow: result.overflow, clipped: result.clipped });
  }

  /* ---- 画面幅に合わせた縮小（印刷時は zoom:1 固定） ---- */
  function fit() {
    var base = probe.getBoundingClientRect().width;
    if (!base) return;
    var avail = document.documentElement.clientWidth - 32;
    var z = Math.min(1, avail / base);
    doc.style.zoom = z < 0.995 ? String(Math.round(z * 1000) / 1000) : "";
  }
  fit();
  var rafId = 0;
  window.addEventListener("resize", function () {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(fit);
  });

  /* ---- 印刷 ---- */
  document.getElementById("btnPrint").addEventListener("click", function () {
    window.print();
  });
})();
</script>
</body>
</html>
