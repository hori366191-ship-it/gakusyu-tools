name: Deploy site to Pages
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'site-src/**'
      - 'site-gas/**'
      - '.github/workflows/pages.yml'
      - '仕様書_移行案.md'
      - 'scripts/build-app1-bundle.mjs'
      - 'scripts/app11/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ステージング生成と事実データ生成は Node 22 で検証している（tests.yml と同じ）。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build app1 bundle from MD
        run: |
          if [ -d "site-src/app1/content" ]; then
            echo "Building bundle.json from site-src/app1/content ..."
            node scripts/build-app1-bundle.mjs
          else
            echo "site-src/app1/content not found - creating placeholder"
            mkdir -p site/app1
            if [ ! -f site/app1/bundle.json ]; then
              echo '{"files":[],"updatedAt":"1970-01-01T00:00:00.000Z","note":"placeholder - no content dir"}' > site/app1/bundle.json
            fi
          fi
          ls -lh site/app1/bundle.json
          echo "bundle preview (first 500 chars):"
          head -c 500 site/app1/bundle.json; echo
          echo "files count:"
          node -e "const j=require('./site/app1/bundle.json'); console.log(j.files.length + ' files, updatedAt=' + j.updatedAt); j.files.forEach(f=>console.log(' - '+f.name+' ('+f.content.length+' chars)'))"

      # app11 の公開統合。site/ は変更せず、配信物 _pages/ を決定論的に組み立てる。
      # - 2D 用の学術配置データ（座標込み）を配信物から外す
      # - 公開 index の「アカデミック」を 3D 画面（./3d/）へのリンクへ変換する
      # - 旧アカデミックのディープリンクは 3D へ引き継ぐ
      # - 3D 用の座標なし事実データ（academic-facts.js）を元データから再生成し、パリティを検証する
      - name: Build Pages staging (app11 public integration)
        run: node scripts/app11/build-pages-staging.cjs --out _pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
