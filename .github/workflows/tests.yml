name: Tests

on:
  push:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'site-src/app11/**'
      - 'scripts/app11/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'site-src/app11/**'
      - 'scripts/app11/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 全 761 回帰は Windows 11 実測 11 分 6 秒。CI の 10 分上限では timeout するため 20 分へ延長する
    # （テスト・assert・Node 版・トリガー・権限は変更しない）。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline tests
        run: node --test scripts/tests/*.test.cjs
