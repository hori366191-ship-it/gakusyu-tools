name: Tests

on:
  push:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'site-src/app11/**'
      - 'scripts/app11/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'site-src/app11/**'
      - 'scripts/app11/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # 2026-11-28 の実測では全 95 ファイルを 1 ジョブで直列実行すると 12 分 24 秒かかった。
    # scripts/tests/shard.cjs で 8 シャードへ均等配分し、matrix で別ランナー並列実行する。
    # 8 分割が対象にするのは 93 ファイル。重い 2 本（app11-academic-stoichiometry /
    # app11-reaction-map）は tests-app11-heavy.yml に分離しており、通常シャードには入らない。
    # テスト本体・assert・Node 版・トリガー・権限は変更しない。
    # timeout-minutes は 1 シャードあたりの保険として 20 分を維持する。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline tests
        run: node --test $(node scripts/tests/shard.cjs ${{ matrix.shard }} 8)
