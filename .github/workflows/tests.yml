name: Tests

on:
  push:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'site-gas/**'
      - 'site-worker/**'
      - 'scripts/tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline tests
        run: node --test scripts/tests/*.test.cjs
